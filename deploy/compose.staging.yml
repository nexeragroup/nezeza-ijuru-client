name: ${COMPOSE_PROJECT_NAME}

services:
  web:
    container_name: ${WEB_CONTAINER_NAME}
    image: ${WEB_IMAGE}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: staging
    environment:
      NODE_ENV: production
      PORT: ${WEB_CONTAINER_PORT}
    ports:
      - 127.0.0.1:${WEB_HOST_PORT}:${WEB_CONTAINER_PORT}
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "node", "-e", "require('node:http').get({host:'127.0.0.1',port:4200,path:'/healthz',headers:{host:'staging.nezezaijuru.org'}},(response)=>{const ok=response.statusCode===200;response.resume();response.on('end',()=>process.exit(ok?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nezeza-ijuru

networks:
  nezeza-ijuru:
    name: ${WEB_NETWORK_NAME}
    external: true
